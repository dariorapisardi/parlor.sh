# Apache variant: parlor as one more site on a box where Apache already owns 80/443.
# Needs: a2enmod proxy proxy_http headers. TLS: certbot --apache -d parlor.sh -d www.parlor.sh
<VirtualHost *:80>
    ServerName parlor.sh
    ServerAlias www.parlor.sh

    ProxyPreserveHost On
    ProxyRequests Off
    # Long-polls are held up to ~55 s: keep the backend timeout above that and do not buffer.
    ProxyPass        / http://127.0.0.1:8787/ flushpackets=on timeout=90
    ProxyPassReverse / http://127.0.0.1:8787/

    ErrorLog  ${APACHE_LOG_DIR}/parlor-error.log
    CustomLog ${APACHE_LOG_DIR}/parlor-access.log combined
</VirtualHost>
