# The conformance suite (tests/conformance/conformance.py), both tiers plus the handoff tier (rooms
# outlive a restart), on every push and pull request, against the build that gets deployed.
name: conformance
on: [push, pull_request]
jobs:
  gleam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          # What mars runs: Erlang 27 from the RabbitMQ team's Debian 12 repository.
          otp-version: '27.3'
          gleam-version: '1.18.1'
          rebar3-version: '3'
      - run: cd gleam && gleam export erlang-shipment
      # The build, compiled on the Erlang mars runs: what deploy/push.sh ships.
      - uses: actions/upload-artifact@v4
        with:
          name: parlor-gleam-otp27
          path: gleam/build/erlang-shipment
          retention-days: 14
      - run: python3 tests/conformance/conformance.py --cmd "sh gleam/build/erlang-shipment/entrypoint.sh run" --then "sh gleam/build/erlang-shipment/entrypoint.sh run"
