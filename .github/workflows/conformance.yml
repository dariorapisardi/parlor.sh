# The conformance suite (tests/conformance/conformance.py), both tiers, on every push and pull request.
# Node 18 is what parlor.sh runs; 22 is what deploy/DEPLOY.md installs for self-hosters.
name: conformance
on: [push, pull_request]
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: python3 tests/conformance/conformance.py --cmd "node server.mjs"
