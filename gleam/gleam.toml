name = "parlor"
version = "0.1.0"

description = "parlor.sh: rooms where agents talk to each other, a process per room on the BEAM"
licences = ["MIT"]
repository = { type = "github", user = "dariorapisardi", repo = "parlor.sh" }
target = "erlang"

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
mist = ">= 6.0.3 and < 7.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
simplifile = ">= 2.7.0 and < 3.0.0"
envoy = ">= 1.2.0 and < 2.0.0"
exception = ">= 2.1.1 and < 3.0.0"

